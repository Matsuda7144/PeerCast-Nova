version: 2.1

# GitHub Actions is the normal automatic CI for this repository.
# CircleCI is retained only as a manual fallback when GitHub Actions is
# unavailable (for example, service outage or usage-limit exhaustion).
parameters:
  run_fallback:
    type: boolean
    default: false

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Show .NET SDK
          command: dotnet --info
      - run:
          name: Restore
          command: dotnet restore PeerCast-Nova.sln
      - run:
          name: Release build
          command: dotnet build PeerCast-Nova.sln --configuration Release --no-restore
      - run:
          name: Full test suite
          command: dotnet test PeerCast-Nova.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
      - run:
          name: Format verification
          command: dotnet format PeerCast-Nova.sln --verify-no-changes --no-restore

workflows:
  fallback-validation:
    when: << pipeline.parameters.run_fallback >>
    jobs:
      - build-and-test
