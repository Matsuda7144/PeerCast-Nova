name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン（例: 0.2.0）。未指定時はタグ名または Directory.Build.props の VersionPrefix を使用します。'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $rawVersion = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $rawVersion = "${{ github.ref_name }}".Substring(1)
            } else {
              [xml]$props = Get-Content "Directory.Build.props"
              $rawVersion = ($props.Project.PropertyGroup.VersionPrefix | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
            }
          }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "Release version could not be resolved."
          }
          "value=$rawVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved release version: $rawVersion"

      - name: Restore app solution
        run: dotnet restore PeerCast-Nova.App.sln

      - name: Run app tests
        run: dotnet test PeerCast-Nova.App.sln --configuration Release --no-restore -m:1 --logger "console;verbosity=normal"

      - name: Publish Portable and Self-Contained packages
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/symbols" | Out-Null

          dotnet publish src/Nova.App/Nova.App.csproj -p:PublishProfile=WindowsPortable -p:Version=$version -o artifacts/publish-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portablePdbs = Get-ChildItem -Path "artifacts/publish-portable" -Filter "*.pdb" -Recurse
          if ($portablePdbs.Count -gt 0) {
            throw "Portable publish unexpectedly contained PDB files."
          }

          $portableZip = "artifacts/release/PeerCast-Nova-$version-win-x64-portable.zip"
          Compress-Archive -Path "artifacts/publish-portable/*" -DestinationPath $portableZip -Force

          dotnet publish src/Nova.App/Nova.App.csproj -p:PublishProfile=WindowsSelfContained -p:Version=$version -o artifacts/publish-self-contained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $selfContainedPdbs = Get-ChildItem -Path "artifacts/publish-self-contained" -Filter "*.pdb" -Recurse
          if ($selfContainedPdbs.Count -gt 0) {
            foreach ($pdb in $selfContainedPdbs) {
              Move-Item -Path $pdb.FullName -Destination (Join-Path "artifacts/symbols" $pdb.Name) -Force
            }
            $symbolsZip = "artifacts/release/PeerCast-Nova-$version-win-x64-symbols.zip"
            Compress-Archive -Path "artifacts/symbols/*" -DestinationPath $symbolsZip -Force
          }

          $selfContainedZip = "artifacts/release/PeerCast-Nova-$version-win-x64-self-contained.zip"
          Compress-Archive -Path "artifacts/publish-self-contained/*" -DestinationPath $selfContainedZip -Force

      - name: Build Windows x64 Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultIscc) {
              $iscc = $defaultIscc
            }
          }
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "Inno Setup 6 (ISCC.exe) was not found."
          }

          $publishDir = (Resolve-Path "artifacts/publish-self-contained").Path
          $outputDir = (Resolve-Path "artifacts/release").Path
          & $iscc "/DAppVersion=$version" "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "packaging/PeerCast-Nova.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $hashes = Get-ChildItem -Path "artifacts/release/*" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath "artifacts/release/SHA256SUMS.txt" -Encoding utf8

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peercast-nova-windows-x64
          path: artifacts/release/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "artifacts/release" -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "PeerCast Nova ${{ github.ref_name }}" --generate-notes
