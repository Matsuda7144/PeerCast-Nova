name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact_suffix: ''
          - runner: windows-latest
            artifact_suffix: -windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PeerCast-Nova.sln

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build PeerCast-Nova.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log${{ matrix.artifact_suffix }}
          path: build.log
          retention-days: 1

      - name: Test
        run: dotnet test PeerCast-Nova.sln --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results${{ matrix.artifact_suffix }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 1

      - name: Format
        run: dotnet format PeerCast-Nova.sln --verify-no-changes --no-restore
