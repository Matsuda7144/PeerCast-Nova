name: Bug report
description: 再現可能な不具合を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 不具合
      description: 何が起きたかを記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nova version
    validations:
      required: true
